<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add an album</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="style/style.css" rel="stylesheet">
</head>

<body class="store-main">
    <header class="vinyl-banner" style="margin-bottom: 20px;">
        <div class="container-fluid">
            <div class="row align-items-center banner-content">
                <!-- Logo and name -->
                <div class="col-12 col-md-6 logo-section">
                    <div class="logo-container">
                        <div class="record-logo">
                            <div class="record-top"></div>
                            <div class="record-middle">
                                <div class="record-label"></div>
                            </div>
                            <div class="record-bottom"></div>
                        </div>
                        <div class="brand-text">
                            <h1 class="store-name">VINYL DEVS</h1>
                            <p class="store-tagline">Your favorite record shop</p>
                        </div>
                    </div>
                </div>

                <!-- Navegation -->
                <div class="col-12 col-md-6 nav-section">
                    <nav class="banner-nav">
                        <ul class="nav-links">
                            <li><a href="index.html" class="nav-link">Home</a></li>
                            <li><a href="#sobres" class="nav-link">Soon</a></li>
                            <li><a href="#contacto" class="nav-link">Soon</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!--Main page start-->

    <main>
        <div class="container" style="text-align: center;">
            <div class="container py-5">
                <div class="row mb-5">
                    <div class="col-12 text-center">
                        <h2 class="section-title">Add a new vinyl record</h2>
                        <p class="section-subtitle">Fill out the form to add a new album</p>
                    </div>
                </div>
                <div class="form-main-border"> <!--Styling for the block-->
                    <div class="form-main-body">
                        <div class="form-main-content">
                            <form role="form">
                                <div class="row mb-3">

                                    <!--Name form-->

                                    <div class="col-12">
                                        <label for="album_name" class="form-label">Album</label>
                                        <input type="text" id="album_name" name="Album" class="form-control"
                                            placeholder="Album title" required>
                                    </div>
                                </div>
                                <div class="row mb-3">

                                    <!--Price form-->

                                    <div class="col-12 col-md-6">
                                        <label for="price" class="form-label">Price</label>
                                        <input type="number" id="price" name="Price" class="form-control" step="0.01"
                                            min="0" placeholder="Price of the vinyl" required>
                                    </div>

                                    <!--Artist form-->

                                    <div class="col-12 col-md-6">
                                        <label for="artist" class="form-label">Artist</label>
                                        <input type="text" id="artist" name="Artist" class="form-control"
                                            placeholder="Artist name" required>
                                    </div>
                                </div>
                                <div class="row mb-3">

                                    <!--Image form-->

                                    <div class="col-12">
                                        <label for="image" class="form-label">Album cover</label>
                                        <input class="form-control" type="file" id="image" name="Image" accept="image/*"
                                            required>
                                    </div>

                                    <!--Release date form-->

                                    <div class="col-12">
                                        <label for="release_date" class="form-label">Release date</label>
                                        <input type="date" id="release_date" name="Release_date" class="form-control"
                                            required>
                                    </div>
                                </div>

                                <div class="row mb-3">

                                    <!--Description form-->

                                    <div class="col-12">
                                        <label for="description" class="form-label">Description</label>
                                        <textarea id="description" name="Description" class="form-control" rows="4"
                                            placeholder="Album description" required></textarea>
                                    </div>

                                    <!--Artist details form-->

                                    <div class="col-12">
                                        <label for="format" class="form-label">Format</label>
                                        <input type="text" id="format" name="Format" class="form-control"
                                            value="Vinyl record" required>
                                    </div>
                                </div>
                                <div class="row">

                                    <!--Canecel and save buttons-->

                                    <div class="col-12 d-flex justify-content-between">
                                        <a href="index.html" class="btn-view-details">Cancel</a>
                                        <button type="submit" class="btn-view-details">Save</button>
                                        <!--Not implemented yet-->
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>

        <!-- Footer -->

        <footer class="vinyl-footer">
            <div class="container-fluid">
                <div class="row align-items-center py-4 footer-content justify-content-between">
                    <div class="col-auto mb-3 mb-md-0">
                        <div class="d-flex align-items-center">
                            <div class="record-logo me-3">
                                <!-- Logo + Text -->
                                <div class="record-top"></div>
                                <div class="record-middle">
                                    <div class="record-label"></div>
                                </div>
                                <div class="record-bottom"></div>
                            </div>
                            <div class="brand-text">
                                <h1 class="store-name h4 mb-1">VINYL DEVS</h1>
                                <p class="store-tagline small mb-0">Your favorite record shop</p>
                            </div>
                        </div>
                    </div>

                    <!-- Opening hours -->
                    <div class="col-auto mb-3 mb-md-0 mx-auto">
                        <div class="text-center">
                            <h3 class="schedule-title h5 mb-3">Opening Hours</h3>
                            <div class="schedule-days">
                                <p class="mb-1">Monday - Friday: 10:00 - 20:00</p>
                                <p class="mb-1">Saturday: 09:00 - 22:00</p>
                                <p class="mb-0">Sunday: 11:00 - 18:00</p>
                            </div>
                        </div>
                    </div>

                    <!-- Back to Top button -->
                    <div class="col-auto">
                        <div class="text-center">
                            <a href="#" class="back-to-top-btn btn btn-outline-light rounded-pill px-4 py-2">
                                <i class="fas fa-chevron-up me-2"></i>
                                Back to Top
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </main>
</body>

</html>
